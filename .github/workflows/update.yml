name: Update Dashboard Daily

on:
  schedule:
    - cron: '30 17 * * *'  # 20:30 Kyiv (UTC+3): після перерахунку на сервері MYBOX о 20:00
  workflow_dispatch:       # manual run button in GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update dashboard data
        env:
          MYBOX_PUBLIC_TOKEN: ${{ secrets.MYBOX_PUBLIC_TOKEN }}
        run: python update_dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "mybox-bot"
          git config user.email "bot@mybox.ua"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update: $(date '+%d.%m.%Y %H:%M') Kyiv"
          git push
